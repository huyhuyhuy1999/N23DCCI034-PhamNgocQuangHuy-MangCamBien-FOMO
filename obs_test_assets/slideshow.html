<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS realtime test - Bottle FOMO</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #111827;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #111827;
    }

    main {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #111827;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #111827;
      display: block;
    }

    .hud {
      position: fixed;
      left: 24px;
      right: 24px;
      bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgb(15 23 42 / 0.76);
      border: 1px solid rgb(148 163 184 / 0.35);
      backdrop-filter: blur(8px);
      font-size: 18px;
      line-height: 1.35;
    }

    .label {
      font-weight: 700;
    }

    .hint {
      color: #cbd5e1;
      font-size: 15px;
      text-align: right;
    }

    @media (max-width: 760px) {
      .hud {
        left: 12px;
        right: 12px;
        bottom: 12px;
        align-items: flex-start;
        flex-direction: column;
        font-size: 15px;
      }

      .hint {
        text-align: left;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main>
    <img id="frame" src="500ml_01.png" alt="Bottle test frame">
  </main>
  <div class="hud">
    <div>
      <span class="label" id="label">500ml</span>
      <span id="counter">1 / 12</span>
    </div>
    <div class="hint">Space: pause/play | ←/→: đổi ảnh | F: fullscreen</div>
  </div>

  <script>
    const frames = [
      { src: "500ml_01.png", label: "500ml" },
      { src: "500ml_02.png", label: "500ml" },
      { src: "500ml_03.png", label: "500ml" },
      { src: "500ml_04.png", label: "500ml" },
      { src: "1L_01.png", label: "1L" },
      { src: "1L_02.png", label: "1L" },
      { src: "1L_03.png", label: "1L" },
      { src: "1L_04.png", label: "1L" },
      { src: "1_5L_01.png", label: "1.5L" },
      { src: "1_5L_02.png", label: "1.5L" },
      { src: "1_5L_03.png", label: "1.5L" },
      { src: "1_5L_04.png", label: "1.5L" }
    ];

    const image = document.getElementById("frame");
    const label = document.getElementById("label");
    const counter = document.getElementById("counter");
    let index = 0;
    let playing = true;

    function show(nextIndex) {
      index = (nextIndex + frames.length) % frames.length;
      const frame = frames[index];
      image.src = frame.src;
      label.textContent = frame.label;
      counter.textContent = `${index + 1} / ${frames.length}`;
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    }

    setInterval(() => {
      if (playing) show(index + 1);
    }, 2600);

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        playing = !playing;
      }
      if (event.code === "ArrowRight") show(index + 1);
      if (event.code === "ArrowLeft") show(index - 1);
      if (event.key.toLowerCase() === "f") toggleFullscreen();
    });
  </script>
</body>
</html>
